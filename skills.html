  <script>
    const skillsContainer = document.getElementById('skillsContainer');
    fetch('assets/json/skills.json')
    .then(response => response.json()) // Parse JSON
    .then(skillsArray => {

    skillsArray.forEach(skill => {
        const skillDiv = document.createElement('div');
        skillDiv.className = `col-lg-2 col-md-2 skills-item filter-${skill.category}`;

        const iconBoxDiv = document.createElement('div');
        iconBoxDiv.className = 'icon-box iconbox-blue';

        const iconDiv = document.createElement('div');
        iconDiv.className = 'icon';

        if (skill.icon) {
            const img = document.createElement('img');
            img.width = 70;
            img.height = 70;
            img.src = skill.icon;
            img.loading="lazy";
            iconDiv.appendChild(img);
        }

        const skillName = document.createElement('h6');
        skillName.textContent = skill.name;

        iconBoxDiv.appendChild(iconDiv);
        iconBoxDiv.appendChild(skillName);
        skillDiv.appendChild(iconBoxDiv);
        skillsContainer.appendChild(skillDiv);
    });
  })
  </script>

  <script>

  }
  </script>
